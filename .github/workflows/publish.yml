name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        registry-url: 'https://registry.npmjs.org'
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Build and run tests
      run: npm test

    - name: Publish to npm (skip if the version already exists)
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      run: |
        VERSION=$(node -p "require('./package.json').version")
        if npm view "semantic-typescript@${VERSION}" version >/dev/null 2>&1; then
          echo "semantic-typescript@${VERSION} already exists on npm, skipping publish."
          exit 0
        fi
        npm publish
